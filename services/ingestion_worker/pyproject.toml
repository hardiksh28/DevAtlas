[project]
name = "ingestion-worker"
version = "0.1.0"
description = "Queue-consuming background worker — global corpus ingestion + freshness re-crawl. First module scoped for independent extraction (ARCHITECTURE.md Section 1)."
requires-python = ">=3.12"
dependencies = [
    "arq>=0.26.0",
    "redis>=5.1.0",
    "sqlalchemy>=2.0.35",
    "asyncpg>=0.30.0",
    "pydantic-settings>=2.5.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
