name: CD

# Pushes to main are gated on the CI workflow actually passing for that
# same commit (workflow_run below) rather than assuming branch protection
# is configured on GitHub — that assumption was unverifiable from the repo
# and meant an untested commit could still reach GHCR. Tag pushes are a
# separate, deliberate release action (a maintainer tagging a commit
# that's already on main, already past CI) so they keep their own trigger.
on:
  push:
    tags: ["v*.*.*"]
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    # Tag pushes always proceed; workflow_run (main pushes) only proceeds
    # if CI actually succeeded for that commit.
    if: github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    strategy:
      matrix:
        include:
          - image: api
            # Context is the monorepo root (not apps/api) so the uv
            # workspace's packages/schemas and packages/object_storage
            # resolve. See docker-compose.yml.
            context: .
            dockerfile: ./apps/api/Dockerfile
          - image: web
            context: .
            dockerfile: ./apps/web/Dockerfile
          - image: worker
            # Same reason as api: needs the uv workspace root in context.
            context: .
            dockerfile: ./services/ingestion_worker/Dockerfile
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run doesn't check out the triggering commit by
          # default (github.ref here would resolve to cd.yml's own
          # default-branch ref) — pin explicitly to the commit CI just
          # passed, falling back to the normal ref for tag pushes.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
