[project]
name = "object-storage"
version = "0.1.0"
description = "Shared async object-storage interface — apps/api (accepts uploads) and services/ingestion_worker (fetches raw bytes, persists fetched GitHub/website content for provenance) both depend on this instead of each hand-rolling S3 client setup (ARCHITECTURE.md Section 6's packages/ rationale)."
requires-python = ">=3.12"
dependencies = [
    "aioboto3>=13.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["object_storage"]

[tool.ruff]
line-length = 100
target-version = "py312"
