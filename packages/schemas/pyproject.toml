[project]
name = "schemas"
version = "0.1.0"
description = "Shared Pydantic models — the cross-boundary shapes apps/api and services/ingestion_worker must agree on (ARCHITECTURE.md Section 6)."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["schemas"]
