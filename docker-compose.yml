services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    entrypoint: ["/entrypoint.sh"]
    env_file: .env
    volumes:
      - ollama_data:/root/.ollama
      - ./infra/docker/ollama/entrypoint.sh:/entrypoint.sh:ro
    ports:
      - "11434:11434"

  # S3-API-compatible object storage for local dev only — the Documentation
  # Ingestion Engine's file storage backend (uploaded markdown/PDFs, fetched
  # GitHub/website content) needs *something* S3-compatible to point at
  # locally. Real S3 (or another managed provider) is what production
  # actually points OBJECT_STORAGE_ENDPOINT_URL at, so this service (and
  # api/worker's dependency on it) lives in docker-compose.override.yml —
  # dev-only, auto-merged by plain `docker compose up`, never present in
  # the `-f docker-compose.yml -f docker-compose.prod.yml` production
  # command. See docs/architecture/ingestion-engine-v1.md Section 8.

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    # No --reload / source bind-mount here — this is the prod-safe base,
    # runs the image built by Dockerfile as-is. Dev-only live-reload lives
    # in docker-compose.override.yml, which `docker compose up` picks up
    # automatically without any -f flag.
    volumes:
      # Curated concept taxonomy content (see packages/taxonomy-data and
      # docs/architecture/curriculum-engine-v1.md) — read-only, since
      # only scripts/seed_taxonomy.py (run inside this container) reads
      # it; nothing here ever writes back to the host checkout. Not part
      # of the image build context (that's ./apps/api only), so this
      # mount is needed in every environment, not just dev.
      - ./packages/taxonomy-data:/packages/taxonomy-data:ro
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./services/ingestion_worker
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    # Dev-only source bind-mount lives in docker-compose.override.yml —
    # see the `api` service's comment above for why.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  ollama_data:
