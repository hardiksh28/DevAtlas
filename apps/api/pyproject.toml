[project]
name = "api"
version = "0.1.0"
description = "AI Engineering Workspace — FastAPI application (modular monolith)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    # [asyncio] pulls in greenlet — SQLAlchemy's async engine/session
    # bridges to it internally on every connection checkout, regardless
    # of dialect. Without this extra, greenlet is never installed and
    # the very first `AsyncSession`/`AsyncEngine` operation raises
    # ValueError at runtime — this was caught by conftest.py's engine
    # fixture (see tests/), not by anything that previously exercised
    # a real DB connection.
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30.0",
    "alembic>=1.13.3",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.2",
    "pgvector>=0.3.5",
    "redis>=5.1.0",
    "langgraph>=0.2.0",
    "ollama>=0.3.3",
    "httpx>=0.27.0",
    "schemas",
    "argon2-cffi>=23.1.0",
    "pyjwt>=2.9.0",
    "email-validator>=2.2.0",
]

[tool.uv.sources]
schemas = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    # Test-only DB driver: lets the auth integration tests run against
    # an in-memory database without Docker/Postgres installed (see
    # tests/conftest.py). CI additionally runs the same suite against
    # real Postgres via TEST_DATABASE_URL for full CITEXT/INET fidelity.
    "aiosqlite>=0.20.0",
]

[tool.uv]
# This is an application, not a library — nothing outside this directory
# ever `pip install`s it. Telling uv not to build/install it as a package
# skips wheel-building entirely; uv just manages the venv + dependencies,
# and `uv run` puts this directory on sys.path so `app.main` still imports.
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# B008 (no function calls in argument defaults) is a real footgun in
# general Python but is *the* documented FastAPI dependency-injection
# pattern (`Depends(get_db)`) — ignoring it here instead of rewriting
# idiomatic FastAPI code around a generic linter rule that doesn't know
# about FastAPI.
ignore = ["B008"]

[tool.mypy]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
